name: service-ci

on:
  workflow_call:
    inputs:
      image-name:
        description: "Service name -> ghcr.io/<owner>/<image-name>"
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: "21"

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: runs on every PR and every push to master
  # ---------------------------------------------------------------------------
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle          # this REPLACES your manual actions/cache step

      - name: Source vulnerability scan (Grype)
        uses: anchore/scan-action@v6
        with:
          path: "."
          fail-build: false        # source scan stays advisory
          severity-cutoff: high

      - name: Build, unit + integration tests, coverage gate
        run: |
          chmod +x gradlew
          ./gradlew build          # dropped --refresh-dependencies (it defeats the cache)
        env:
          USERNAME: ${{ secrets.GPR_USER }}
          TOKEN: ${{ secrets.GPR_KEY }}

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.image-name }}
          path: "**/build/reports/"
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Package + publish: ONLY on push to master (skipped for PRs)
  # ---------------------------------------------------------------------------
  package:
    name: Package and Publish
    needs: [ build-test ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Build OCI image (Paketo, JRE, Spring AOT)
        run: |
          chmod +x gradlew
          ./gradlew bootBuildImage \
            --imageName ${{ env.IMAGE }}:${{ github.sha }} \
            -Pbuilder=paketobuildpacks/builder-jammy-tiny:latest \
            -Pbuildpacks=gcr.io/paketo-buildpacks/java \
            -PBP_JVM_VERSION=21 \
            -PBP_JVM_TYPE=JRE \
            -PBP_JAVA_OPTS='-XX:+UseZGC -XX:MaxRAMPercentage=75.0' \
            -PBP_SPRING_AOT_ENABLED=true \
            -PBP_LIVE_RELOAD_ENABLED=false \
            --build-cache \
            --configuration-cache
        env:
          USERNAME: ${{ secrets.GPR_USER }}
          TOKEN: ${{ secrets.GPR_KEY }}

      - name: Image vulnerability scan (Grype)
        id: scan
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical 

      - name: Upload scan results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image (immutable SHA tag only)
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}
