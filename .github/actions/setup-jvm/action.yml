name: Set up JVM build
description: >-
  Validates the Gradle wrapper, installs a Temurin JDK, and configures Gradle
  with dependency caching. Shared by service-validate and service-release so the
  two paths cannot drift in how they build.

inputs:
  java-version:
    description: >-
      Temurin major version. Empty (default) reads `javaVersion` from the checked-out
      repo's gradle.properties, falling back to 21, so the JDK has one source of truth.
    required: false
    default: ""
  cache-read-only:
    description: >-
      Set true on paths that should consume the cache but never write it.
      Gradle's action already writes only from the default branch, so leave
      false unless a path must be provably side-effect free.
    required: false
    default: "false"

outputs:
  java-version:
    description: The JDK major version that was installed
    value: ${{ steps.jdk.outputs.java-version }}

runs:
  using: composite
  steps:
    - name: Resolve JDK version
      id: jdk
      shell: bash
      env:
        JAVA_VERSION: ${{ inputs.java-version }}
      run: python3 "${{ github.action_path }}/java_version.py"

    # gradle-wrapper.jar is a tracked binary in all ten service repos. This is
    # the only thing standing between a tampered wrapper and arbitrary execution
    # with the job's permissions.
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Install JDK ${{ steps.jdk.outputs.java-version }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: ${{ steps.jdk.outputs.java-version }}

    - name: Configure Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        add-job-summary: on-failure
