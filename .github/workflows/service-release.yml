name: service-release

# Post-merge release for a Spring Boot service.
#
# Builds and tests ONCE, packages that same output into an image, verifies it,
# publishes it, and emits a manifest naming the immutable digest. That digest is
# the deployment identity: every environment, and later Argo CD, consumes it
# without rebuilding. Tags are aliases for humans; the digest is authoritative.
#
# Callers must grant exactly:
#   permissions:
#     contents: write        # cut the GitHub Release (git tag) in the service repo
#     packages: write
#     security-events: write
#     actions: read
# and pass GPR_USER, GPR_KEY, LEDGER_TOKEN as secrets (never `secrets: inherit`).

on:
  workflow_call:
    inputs:
      image-name:
        description: Service name; the image is ghcr.io/<owner>/<image-name>
        required: true
        type: string
      version:
        description: >-
          Human-supplied semantic version for this release, MAJOR.MINOR.PATCH
          (no leading v). Tags the image v<version>, cuts a GitHub Release, and
          is recorded in the deploy ledger. The image digest stays authoritative;
          the version is the readable alias.
        required: true
        type: string
      java-version:
        description: Temurin major version
        required: false
        type: string
        default: "21"
      severity-cutoff:
        description: >-
          Grype threshold that fails the build. Paired with only-fixed, so a
          finding with no available fix reports without blocking every service's
          releases behind an upstream base-image rebuild.
        required: false
        type: string
        default: high
      enable-code-scanning:
        description: >-
          Upload SARIF to GitHub code scanning. Off by default: it requires a
          public repo or GitHub Advanced Security, and on a private free-plan
          repo the upload fails every run. The vulnerability gate does not depend
          on it -- findings are always rendered in the run summary.
        required: false
        type: boolean
        default: false
      publish-latest:
        description: >-
          Also move the :latest alias. Off by default. :latest must never appear
          in a deployment reference -- it makes the running artifact unnameable
          and rollback inexpressible.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 45
    secrets:
      GPR_USER:
        description: GitHub Packages user for dineroo-event-contracts
        required: true
      GPR_KEY:
        description: GitHub Packages token for dineroo-event-contracts
        required: true
      LEDGER_TOKEN:
        description: >-
          Token with Contents:write on dineroo-gn/dineroo-deployment, used to
          commit the release's digest to the deploy ledger. Passed explicitly --
          never `secrets: inherit` into this public workflow.
        required: true
    outputs:
      digest:
        description: Immutable registry digest of the published image
        value: ${{ jobs.release.outputs.digest }}
      image:
        description: Fully qualified image name, without tag or digest
        value: ${{ jobs.release.outputs.image }}

# Releases queue rather than cancel. Killing one mid-push leaves a partially
# published tag and no manifest.
concurrency:
  group: release-${{ inputs.image-name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write   # cut the GitHub Release (git tag v<version>) in the service repo
      packages: write
      security-events: write
      actions: read   # required by codeql-action/upload-sarif
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
      TAG: v${{ inputs.version }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out ${{ inputs.image-name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail before the ~40-minute build if the version is malformed or already
      # released. A release is immutable: refuse to overwrite an existing tag.
      - name: Validate version is new semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Bad version::'$version' is not MAJOR.MINOR.PATCH (no leading v)."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Version exists::Release v$version already exists. Pick a new version."
            exit 1
          fi

      - name: Set up JVM build
        uses: cgf-platform/shared-workflows/.github/actions/setup-jvm@v3.1.0
        with:
          java-version: ${{ inputs.java-version }}

      # Stamp the released semver into the Gradle build so the artifact reports it
      # (Boot banner, actuator /info, JAR manifest) instead of the repo's SNAPSHOT
      # placeholder. CI checkout only -- never committed back. Fails loudly rather
      # than silently shipping a SNAPSHOT version.
      - name: Stamp the release version into the build
        run: |
          set -euo pipefail
          file="build.gradle.kts"
          [ -f "$file" ] || file="build.gradle"
          if ! grep -qE '^version[[:space:]]*=' "$file"; then
            echo "::error title=No version line::No 'version =' line in $file to stamp."
            exit 1
          fi
          sed -i -E "s|^version[[:space:]]*=.*|version = \"${{ inputs.version }}\"|" "$file"
          echo "Stamped $file:"; grep -E '^version[[:space:]]*=' "$file"

      # One Gradle invocation, so `build` and `bootBuildImage` share a single
      # task graph and the image is packaged from the output that was just
      # tested. The previous two-job shape re-checked-out and recompiled.
      - name: Build, test and package image
        run: ./gradlew build bootBuildImage --imageName "$IMAGE:$TAG" --build-cache
        env:
          USERNAME: ${{ secrets.GPR_USER }}
          TOKEN: ${{ secrets.GPR_KEY }}

      - name: Report tests and coverage
        if: ${{ !cancelled() }}
        uses: cgf-platform/shared-workflows/.github/actions/jvm-report@v3.1.0
        with:
          service-name: ${{ inputs.image-name }}
          retention-days: "30"

      # Asserts what the pipeline ships rather than trusting its own step
      # names. Seven -PBP_* flags in a previous version never reached the
      # buildpack, so images shipped a full JDK under a step labelled "JRE".
      - name: Record image facts
        if: ${{ !cancelled() }}
        uses: cgf-platform/shared-workflows/.github/actions/image-facts@v3.1.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}

      # Scanned before publication, so a failing image is never pushed. The bytes
      # scanned are the bytes the digest will address.
      - name: Scan image for vulnerabilities
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          fail-build: false   # the gate step below decides, with a readable report
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: true
          output-format: sarif

      # Consumes the security-events: write that every caller already granted
      # and nothing previously used. Uploads on failure too, so a blocked release
      # leaves the findings behind for triage.
      - name: Upload scan results to code scanning
        if: ${{ inputs.enable-code-scanning && !cancelled() && steps.scan.outputs.sarif != '' }}
        continue-on-error: true   # a code-scanning outage must never fail a release
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-image

      # Runs after the upload so findings reach code scanning either way.
      - name: Gate on vulnerabilities
        if: ${{ !cancelled() }}
        uses: cgf-platform/shared-workflows/.github/actions/vulnerability-gate@v3.1.0
        with:
          sarif-file: ${{ steps.scan.outputs.sarif }}
          severity-cutoff: ${{ inputs.severity-cutoff }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image and capture digest
        id: publish
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          digest=$(docker image inspect "$IMAGE:$TAG" \
                   --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          if [ -z "$digest" ]; then
            echo "::error title=No digest::Push reported success but the registry \
          digest could not be resolved. Refusing to emit a manifest that cannot \
          be deployed."
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "**Published** \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Move :latest alias
        if: ${{ inputs.publish-latest }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      # The deployment contract. Promotion reads the digest from here; nothing
      # downstream rebuilds.
      - name: Emit release manifest
        run: |
          set -euo pipefail
          cat > release-manifest.yaml <<EOF
          service: ${{ inputs.image-name }}
          image: ${{ steps.publish.outputs.image }}
          digest: ${{ steps.publish.outputs.digest }}
          commit: ${{ github.sha }}
          repo: ${{ github.repository }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          workflowRef: ${{ github.workflow_ref }}
          builtAt: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat release-manifest.yaml

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ inputs.image-name }}
          path: release-manifest.yaml
          retention-days: 90

      # The human-readable alias for the digest: a git tag + release notes in the
      # service repo. The digest, not this tag, remains the deployment identity.
      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      # The deploy contract. Written here, same-org, with a least-privilege token;
      # the VPS reconciler reads the digest from this file. Rollback = git revert.
      - name: Check out the deploy ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dineroo-gn/dineroo-deployment
          token: ${{ secrets.LEDGER_TOKEN }}
          path: .deploy-ledger

      - name: Record the release in the deploy ledger
        working-directory: .deploy-ledger
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ledger="environments/prod/${IMAGE_NAME}.yaml"
          if [ ! -f "$ledger" ]; then
            echo "::error title=No ledger file::$ledger not found in dineroo-deployment."
            exit 1
          fi
          released_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$ledger" <<EOF
          service: ${IMAGE_NAME}
          image: ${IMAGE}
          semver: ${VERSION}
          digest: ${DIGEST}
          commit: ${SHA}
          released_at: ${released_at}
          released_by: ${ACTOR}
          EOF
          git config user.name "dineroo-release[bot]"
          git config user.email "release@dineroo.africa"
          git add "$ledger"
          if git diff --cached --quiet; then
            echo "Ledger already at this release; nothing to commit."
            exit 0
          fi
          git commit -m "deploy(prod): ${IMAGE_NAME} v${VERSION}"
          # Per-file entries, but a shared branch: rebase-retry so concurrent
          # releases of different services don't clobber each other.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Ledger updated (attempt $attempt)."
              exit 0
            fi
            echo "Push race on attempt $attempt; rebasing onto origin/master."
            git fetch origin master
            git rebase origin/master
          done
          echo "::error title=Ledger push failed::Could not push ledger after 5 attempts."
          exit 1