name: service-release

# Post-merge release for a Spring Boot service.
#
# Builds and tests ONCE, packages that same output into an image, verifies it,
# publishes it at v<version>, and cuts a GitHub Release. The digest is the
# deployment identity; the tag is the human alias. This workflow does NOT deploy:
# it produces a release candidate. Promotion to production is a separate, deliberate
# step (dineroo-deployment/promote.yml) that writes the chosen version's digest to
# the ledger.
#
# Callers must grant exactly:
#   permissions:
#     contents: write        # cut the GitHub Release (git tag) in the service repo
#     packages: write
#     security-events: write
#     actions: read
# and pass GPR_USER, GPR_KEY, LEDGER_TOKEN as secrets (never `secrets: inherit`).

on:
  workflow_call:
    inputs:
      image-name:
        description: Service name; the image is ghcr.io/<owner>/<image-name>
        required: true
        type: string
      version:
        description: >-
          Human-supplied semantic version for this release, MAJOR.MINOR.PATCH
          (no leading v). Tags the image v<version>, cuts a GitHub Release, and
          is recorded in the deploy ledger. The image digest stays authoritative;
          the version is the readable alias.
        required: true
        type: string
      java-version:
        description: >-
          Temurin major version. Empty (default) reads `javaVersion` from the service's
          gradle.properties so the JDK has a single source of truth, falling back to 21.
        required: false
        type: string
        default: ""
      severity-cutoff:
        description: >-
          Grype threshold that fails the build. Paired with only-fixed, so a
          finding with no available fix reports without blocking every service's
          releases behind an upstream base-image rebuild.
        required: false
        type: string
        default: high
      vulnerability-exceptions-file:
        description: >-
          Path, in the service repo, to a JSON list of time-boxed exceptions for
          findings whose upstream fix has not reached the image yet (e.g. a Go
          stdlib CVE in buildpack helpers before Paketo rebuilds). Each entry is
          {id, owner, reason, expires: YYYY-MM-DD}. Absent file = no exceptions;
          malformed file = release fails; expired entry = finding blocks again.
        required: false
        type: string
        default: .github/vulnerability-exceptions.json
      enable-code-scanning:
        description: >-
          Upload SARIF to GitHub code scanning. Off by default: it requires a
          public repo or GitHub Advanced Security, and on a private free-plan
          repo the upload fails every run. The vulnerability gate does not depend
          on it -- findings are always rendered in the run summary.
        required: false
        type: boolean
        default: false
      publish-latest:
        description: >-
          Also move the :latest alias. Off by default. :latest must never appear
          in a deployment reference -- it makes the running artifact unnameable
          and rollback inexpressible.
        required: false
        type: boolean
        default: false
      generate-sbom:
        description: >-
          Attach an SPDX SBOM of the image to the run as an artifact. Informational:
          a failure to generate it never blocks a release.
        required: false
        type: boolean
        default: true
      timeout-minutes:
        required: false
        type: number
        default: 45
    secrets:
      GPR_USER:
        description: GitHub Packages user for event-contracts
        required: true
      GPR_KEY:
        description: GitHub Packages token for event-contracts
        required: true
      LEDGER_TOKEN:
        description: >-
          Deprecated / unused. Releases no longer write the deploy ledger --
          promotion is a separate workflow (dineroo-deployment/promote.yml).
          Kept optional so existing callers don't break; safe to stop passing it.
        required: false
    outputs:
      digest:
        description: Immutable registry digest of the published image
        value: ${{ jobs.release.outputs.digest }}
      image:
        description: Fully qualified image name, without tag or digest
        value: ${{ jobs.release.outputs.image }}

# Releases queue rather than cancel. Killing one mid-push leaves a partially
# published tag and no manifest.
concurrency:
  group: release-${{ inputs.image-name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write   # cut the GitHub Release (git tag v<version>) in the service repo
      packages: write
      security-events: write
      actions: read   # required by codeql-action/upload-sarif
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
      TAG: v${{ inputs.version }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out ${{ inputs.image-name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # release talks to GitHub through GH_TOKEN, never git

      # Fail before the ~40-minute build if the version is malformed or already
      # released. A release is immutable: refuse to overwrite an existing tag.
      - name: Validate version is new semver
        uses: cgf-platform/shared-workflows/.github/actions/validate-release-version@v3.10.0
        with:
          version: ${{ inputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JVM build
        uses: cgf-platform/shared-workflows/.github/actions/setup-jvm@v3.10.0
        with:
          java-version: ${{ inputs.java-version }}

      # Stamp the released semver into the Gradle build so the artifact reports it
      # (Boot banner, actuator /info, JAR manifest) instead of the repo's SNAPSHOT
      # placeholder. CI checkout only -- never committed back. Fails loudly rather
      # than silently shipping a SNAPSHOT version.
      - name: Stamp the release version into the build
        env:
          RELEASE_VERSION: ${{ inputs.version }}   # already validated as MAJOR.MINOR.PATCH
        run: |
          set -euo pipefail
          file="build.gradle.kts"
          [ -f "$file" ] || file="build.gradle"
          if ! grep -qE '^version[[:space:]]*=' "$file"; then
            echo "::error title=No version line::No 'version =' line in $file to stamp."
            exit 1
          fi
          sed -i -E "s|^version[[:space:]]*=.*|version = \"${RELEASE_VERSION}\"|" "$file"
          echo "Stamped $file:"; grep -E '^version[[:space:]]*=' "$file"

      # One Gradle invocation, so `build` and `bootBuildImage` share a single
      # task graph and the image is packaged from the output that was just
      # tested. The previous two-job shape re-checked-out and recompiled.
      - name: Build, test and package image
        run: ./gradlew build bootBuildImage --imageName "$IMAGE:$TAG" --build-cache
        env:
          USERNAME: ${{ secrets.GPR_USER }}
          TOKEN: ${{ secrets.GPR_KEY }}

      - name: Report tests and coverage
        if: ${{ !cancelled() }}
        uses: cgf-platform/shared-workflows/.github/actions/jvm-report@v3.10.0
        with:
          service-name: ${{ inputs.image-name }}
          retention-days: "30"

      # Asserts what the pipeline ships rather than trusting its own step
      # names. Seven -PBP_* flags in a previous version never reached the
      # buildpack, so images shipped a full JDK under a step labelled "JRE".
      - name: Record image facts
        if: ${{ !cancelled() }}
        uses: cgf-platform/shared-workflows/.github/actions/image-facts@v3.10.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}

      # Scanned before publication, so a failing image is never pushed. The bytes
      # scanned are the bytes the digest will address.
      - name: Scan image for vulnerabilities
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          fail-build: false   # the gate step below decides, with a readable report
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: true
          output-format: sarif

      # Informational supply-chain record of exactly the bytes about to be published.
      # Never blocks: a syft hiccup must not fail an otherwise green release.
      - name: Generate SBOM
        if: ${{ inputs.generate-sbom && !cancelled() }}
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: spdx-json
          artifact-name: sbom-${{ inputs.image-name }}.spdx.json
          upload-artifact-retention: 90

      # Consumes the security-events: write that every caller already granted
      # and nothing previously used. Uploads on failure too, so a blocked release
      # leaves the findings behind for triage.
      - name: Upload scan results to code scanning
        if: ${{ inputs.enable-code-scanning && !cancelled() && steps.scan.outputs.sarif != '' }}
        continue-on-error: true   # a code-scanning outage must never fail a release
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-image

      # Runs after the upload so findings reach code scanning either way.
      - name: Gate on vulnerabilities
        if: ${{ !cancelled() }}
        uses: cgf-platform/shared-workflows/.github/actions/vulnerability-gate@v3.10.0
        with:
          sarif-file: ${{ steps.scan.outputs.sarif }}
          severity-cutoff: ${{ inputs.severity-cutoff }}
          exceptions-file: ${{ inputs.vulnerability-exceptions-file }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image and capture digest
        id: publish
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          digest=$(docker image inspect "$IMAGE:$TAG" \
                   --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          if [ -z "$digest" ]; then
            echo "::error title=No digest::Push reported success but the registry \
          digest could not be resolved. Refusing to emit a manifest that cannot \
          be deployed."
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "**Published** \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Move :latest alias
        if: ${{ inputs.publish-latest }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      # The deployment contract. Promotion reads the digest from here; nothing
      # downstream rebuilds.
      - name: Emit release manifest
        env:
          SERVICE: ${{ inputs.image-name }}
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cat > release-manifest.yaml <<EOF
          service: ${SERVICE}
          image: ${PUBLISHED_IMAGE}
          digest: ${PUBLISHED_DIGEST}
          commit: ${GITHUB_SHA}
          repo: ${GITHUB_REPOSITORY}
          run: ${RUN_URL}
          workflowRef: ${WORKFLOW_REF}
          builtAt: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat release-manifest.yaml

      - name: Upload release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ inputs.image-name }}
          path: release-manifest.yaml
          retention-days: 90

      # The human-readable alias for the digest: a git tag + release notes in the
      # service repo. The digest, not this tag, remains the deployment identity.
      # A release produces an immutable, versioned image and a GitHub Release, but
      # does NOT deploy. Promotion to production is a separate, deliberate step:
      # dineroo-deployment's promote workflow writes the chosen version's digest to
      # the ledger, which the VPS reconciler then rolls out.
      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes